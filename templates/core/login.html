{% extends "index.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .login-container h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
    }
    .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    .form-group input[type="submit"] {
        background-color: #2c3e50;
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
    }
    .form-group input[type="submit"]:hover {
        background-color: #34495e;
    }
</style>
<div class="login-container">
    <h2>Kirish</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.username.label_tag }}
            {{ form.username }}
        </div>
        <div class="form-group">
            {{ form.password.label_tag }}
            {{ form.password }}
        </div>
        <div class="form-group">
            <input type="submit" value="Kirish">
        </div>
        {% if form.errors %}
            <p style="color: red;">Noto‘g‘ri login yoki parol</p>
        {% endif %}
    </form>
</div>
{% endblock %}
